{{- if not .Values.secretExistingSecretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mbuni-cex.fullname" . }}
  labels:
    {{- include "mbuni-cex.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.envSecrets }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end -}}
