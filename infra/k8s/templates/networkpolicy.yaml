{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mbuni-cex.fullname" . }}
  labels:
    {{- include "mbuni-cex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mbuni-cex.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from anywhere to the http port (the Ingress controller will
    # forward from outside the namespace)
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress (for any external calls — NextAuth, OAuth, etc.)
    - ports:
        - protocol: TCP
          port: 443
    {{- if .Values.networkPolicy.dbEgressCidr }}
    # Database
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.dbEgressCidr }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- end -}}
