apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mbuni-cex.serviceAccountName" . }}
  labels:
    {{- include "mbuni-cex.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.serviceAccount.create }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount | default false }}
{{- end }}
