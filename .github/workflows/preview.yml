# =============================================================================
# Mbuni CEX — Ephemeral preview environments per PR
#
# For every PR opened against main/master, this workflow:
#   1. Builds a Docker image tagged with the PR number (e.g. pr-42)
#   2. Pushes it to GHCR
#   3. Creates a unique Kubernetes namespace (mbuni-cex-pr-42)
#   4. Installs a Helm release with a unique ingress host (pr-42.cex-preview.your-domain.com)
#   5. Comments on the PR with the preview URL
#
# When the PR is closed (merged or rejected), the namespace is destroyed.
#
# Requirements:
#   - KUBE_CONFIG_PREVIEWS secret in GitHub (base64-encoded kubeconfig for a
#     cluster that can create namespaces + ingress)
#   - A wildcard DNS record (*.cex-preview.your-domain.com → your ingress IP)
#   - A wildcard TLS cert (or cert-manager with a wildcard Issuer)
#   - The cluster must be able to pull from ghcr.io (public image is fine;
#     private requires an imagePullSecret)
#
# The preview uses the same Helm chart as production (infra/k8s/) but with a
# values overlay that:
#   - Disables HPA (single replica is fine for a preview)
#   - Uses a per-PR ingress host
#   - Uses an ephemeral PostgreSQL instance (deployed in the same namespace)
#   - Auto-seeds demo users
# =============================================================================

name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, master]

# Cancel in-progress runs for the same PR
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PREVIEW_DOMAIN: cex-preview.your-domain.com

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build + deploy preview (runs on PR open / sync / reopen)
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set PR variables
        id: vars
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          NAMESPACE="mbuni-cex-pr-${PR_NUMBER}"
          HOST="pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
          IMAGE_TAG="pr-${PR_NUMBER}"
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_sha=${PR_SHA::7}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          echo "host=${HOST}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image=${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "::notice::Preview will be at https://${HOST}"

      # ----- Build + push Docker image (PR-specific tag) -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      # ----- Deploy ephemeral PostgreSQL + app via Helm -----
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PREVIEWS }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Create namespace
        run: |
          kubectl create namespace ${{ steps.vars.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ steps.vars.outputs.namespace }} \
            app.kubernetes.io/name=mbuni-cex-preview \
            pr-number=${{ steps.vars.outputs.pr_number }} \
            pr-sha=${{ steps.vars.outputs.pr_sha }} \
            --overwrite

      - name: Deploy ephemeral PostgreSQL
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm upgrade --install postgres bitnami/postgresql \
            --namespace ${{ steps.vars.outputs.namespace }} \
            --set auth.postgresPassword=preview-password \
            --set auth.database=mbuni_cex \
            --set primary.persistence.enabled=false \
            --wait --timeout 2m

      - name: Generate preview NEXTAUTH_SECRET
        id: secret
        run: |
          SECRET=$(openssl rand -base64 32)
          # Mask it from logs
          echo "::add-mask::$SECRET"
          echo "nextauth_secret=$SECRET" >> $GITHUB_OUTPUT

      - name: Deploy Mbuni CEX via Helm
        run: |
          helm upgrade --install mbuni-cex infra/k8s/ \
            --namespace ${{ steps.vars.outputs.namespace }} \
            --atomic \
            --timeout 5m \
            --set image.repository=${REGISTRY}/${IMAGE_NAME,,} \
            --set image.tag=${{ steps.vars.outputs.image_tag }} \
            --set image.pullPolicy=Always \
            --set replicaCount=1 \
            --set autoscaling.enabled=false \
            --set podDisruptionBudget.enabled=false \
            --set config.NEXTAUTH_URL=https://${{ steps.vars.outputs.host }} \
            --set config.NODE_ENV=production \
            --set envSecrets.DATABASE_URL="postgresql://postgres:preview-password@postgres-postgresql.${{ steps.vars.outputs.namespace }}.svc.cluster.local:5432/mbuni_cex?schema=public" \
            --set envSecrets.NEXTAUTH_SECRET="${{ steps.secret.outputs.nextauth_secret }}" \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set "ingress.hosts[0].host=${{ steps.vars.outputs.host }}" \
            --set "ingress.hosts[0].paths[0].path=/" \
            --set "ingress.hosts[0].paths[0].pathType=Prefix" \
            --set "ingress.tls[0].secretName=mbuni-cex-preview-tls" \
            --set "ingress.tls[0].hosts[0]=${{ steps.vars.outputs.host }}" \
            --set ingress.annotations.cert-manager\\.io/cluster-issuer=letsencrypt-prod \
            --set ingress.annotations.nginx\\.ingress\\.kubernetes\\.io/ssl-redirect="true"

      - name: Apply DB schema + seed demo users
        run: |
          # Wait for the pod to be ready, then run db:push + db:seed in it
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=mbuni-cex \
            -n ${{ steps.vars.outputs.namespace }} \
            --timeout=180s
          kubectl exec -n ${{ steps.vars.outputs.namespace }} \
            deployment/mbuni-cex -- bun run db:push
          kubectl exec -n ${{ steps.vars.outputs.namespace }} \
            deployment/mbuni-cex -- bun run db:seed

      # ----- Comment on the PR with the preview URL -----
      - name: Find existing preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ steps.vars.outputs.pr_number }}
          comment-author: github-actions[bot]
          body-includes: <!-- preview-env-comment -->

      - name: Comment preview URL on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.vars.outputs.pr_number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- preview-env-comment -->
            ## 🚀 Preview environment

            | | |
            |---|---|
            | **URL** | https://${{ steps.vars.outputs.host }} |
            | **Commit** | ${{ steps.vars.outputs.pr_sha }} |
            | **Namespace** | `${{ steps.vars.outputs.namespace }}` |
            | **Image** | `${{ steps.vars.outputs.image }}` |

            **Demo accounts** (auto-seeded):
            | Email | Password | Tier |
            |---|---|---|
            | `admin@mbuni.cex` | `adminpass123` | 5 |
            | `alex.demo@mbuni.cex` | `testpass123` | 3 |

            The preview will be **automatically destroyed** when this PR is closed.

            ---
            <sub>🤖 This comment was generated by the [Preview Environment workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).</sub>

  # ---------------------------------------------------------------------------
  # Job 2: Destroy preview (runs when PR is closed)
  # ---------------------------------------------------------------------------
  destroy-preview:
    name: Destroy Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set PR variables
        id: vars
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "namespace=mbuni-cex-pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "image_tag=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "host=pr-${PR_NUMBER}.${PREVIEW_DOMAIN}" >> $GITHUB_OUTPUT

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PREVIEWS }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Uninstall Helm release
        run: |
          helm uninstall mbuni-cex --namespace ${{ steps.vars.outputs.namespace }} || true
          helm uninstall postgres --namespace ${{ steps.vars.outputs.namespace }} || true

      - name: Delete namespace
        run: |
          kubectl delete namespace ${{ steps.vars.outputs.namespace }} --ignore-not-found=true

      - name: Comment cleanup confirmation on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🧹 Preview environment destroyed

            Namespace `${{ steps.vars.outputs.namespace }}` and all resources have been deleted.
            The Docker image `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}` will be garbage-collected by GHCR (configurable in package settings).
