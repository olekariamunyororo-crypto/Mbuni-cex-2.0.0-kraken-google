# =============================================================================
# Mbuni CEX — Publish reports to GitHub Pages
#
# Publishes the Vitest coverage report + Playwright HTML report to GitHub
# Pages on every push to main. The reports are viewable at:
#
#   https://<your-org>.github.io/mbuni-cex/reports/coverage/
#   https://<your-org>.github.io/mbuni-cex/reports/playwright/
#
# One-time setup (repo Settings → Pages):
#   - Source: GitHub Actions
#
# The workflow uses the official `actions/deploy-pages` action — no manual
# gh-pages branch needed.
# =============================================================================

name: Publish Reports

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same ref
concurrency:
  group: pages
  cancel-in-progress: false

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the reports (coverage + Playwright)
  # ---------------------------------------------------------------------------
  build-reports:
    name: Build Reports
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply DB schema (ephemeral SQLite for the test run)
        run: bun run db:push
        env:
          DATABASE_URL: file:./db/ci-reports.db

      - name: Seed demo users
        run: bun run db:seed
        env:
          DATABASE_URL: file:./db/ci-reports.db

      # ----- Coverage report -----
      - name: Run unit tests with coverage
        run: bun run test:unit -- --coverage
        env:
          CI: "true"

      # ----- Playwright report -----
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests (continue on failure — we still want the report)
        run: bun run test:e2e || true
        env:
          DATABASE_URL: file:./db/ci-reports.db
          NEXTAUTH_SECRET: ci-reports-test-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
          CI: "true"

      # ----- Assemble the Pages site -----
      - name: Assemble site
        run: |
          mkdir -p ./_site/reports/coverage ./_site/reports/playwright
          # Coverage HTML report
          if [ -d ./coverage ]; then
            cp -r ./coverage/* ./_site/reports/coverage/ 2>/dev/null || true
          fi
          # Playwright HTML report
          if [ -d ./playwright-report ]; then
            cp -r ./playwright-report/* ./_site/reports/playwright/ 2>/dev/null || true
          fi
          # Index page with links to both reports
          cat > ./_site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Mbuni CEX — Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; color: #1a202c; background: #f7fafc; }
              h1 { font-size: 2rem; margin-bottom: 0.5rem; }
              .subtitle { color: #718096; margin-bottom: 2rem; }
              .card { display: block; padding: 1.5rem; background: white; border: 1px solid #e2e8f0; border-radius: 0.5rem; margin-bottom: 1rem; text-decoration: none; color: inherit; transition: all 0.15s; }
              .card:hover { border-color: #38b2ac; box-shadow: 0 4px 12px rgba(56, 178, 172, 0.15); }
              .card h2 { margin: 0 0 0.25rem; font-size: 1.25rem; color: #2d3748; }
              .card p { margin: 0; color: #718096; font-size: 0.9rem; }
              .badge { display: inline-block; padding: 0.125rem 0.5rem; background: #e6fffa; color: #285e61; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem; }
              .footer { margin-top: 3rem; color: #a0aec0; font-size: 0.85rem; }
              a { color: #319795; }
            </style>
          </head>
          <body>
            <h1>🦬 Mbuni CEX — Reports</h1>
            <p class="subtitle">Test coverage + e2e reports for the latest commit on <code>main</code>.</p>
            <a class="card" href="reports/coverage/index.html">
              <h2>📊 Coverage Report <span class="badge">Vitest</span></h2>
              <p>Line + branch coverage for the matching engine, formatters, and lib modules.</p>
            </a>
            <a class="card" href="reports/playwright/index.html">
              <h2>🎭 Playwright Report <span class="badge">E2E + Visual</span></h2>
              <p>Functional e2e tests + visual regression screenshots. Click any test to see traces + diffs.</p>
            </a>
            <div class="footer">
              Generated by <code>.github/workflows/pages.yml</code> on every push to <code>main</code>.<br>
              Source: <a href="https://github.com/your-org/mbuni-cex">your-org/mbuni-cex</a>
            </div>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build-reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
